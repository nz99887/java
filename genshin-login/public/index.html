<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>提瓦特 · 登录</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="glow"></div>
    <span class="link-status" id="linkStatus">连接中…</span>

    <!-- 七元素主题切换 -->
    <div class="theme-switch" title="切换元素主题">
      <button class="dot" data-theme="anemo"   style="background:#9be8a8;color:#9be8a8" title="风"></button>
      <button class="dot" data-theme="geo"     style="background:#e8c87a;color:#e8c87a" title="岩"></button>
      <button class="dot" data-theme="electro" style="background:#c4a0ff;color:#c4a0ff" title="雷"></button>
      <button class="dot" data-theme="dendro"  style="background:#bfe86a;color:#bfe86a" title="草"></button>
      <button class="dot" data-theme="hydro"   style="background:#7ec8ff;color:#7ec8ff" title="水"></button>
      <button class="dot" data-theme="pyro"    style="background:#ff9a5a;color:#ff9a5a" title="火"></button>
      <button class="dot" data-theme="cryo"    style="background:#cfefff;color:#cfefff" title="冰"></button>
      <button class="vision-toggle" title="神之眼装饰">
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="vision-deco" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <ellipse cx="60" cy="60" rx="42" ry="54" fill="none" stroke="currentColor" stroke-width="3"/>
        <ellipse cx="60" cy="60" rx="31" ry="41" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
        <path d="M60 14 L70 52 L108 60 L70 68 L60 106 L50 68 L12 60 L50 52 Z" fill="currentColor" opacity="0.92"/>
      </svg>
    </div>

    <div class="wrap">
      <!-- 登录表单 -->
      <div class="panel" id="loginPanel">
        <h1 class="title">提瓦特</h1>
        <p class="subtitle">旅 行 者 登 录</p>

        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label class="label">账号</label>
            <div class="input-line">
              <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/></svg></span>
              <input type="text" id="username" placeholder="输入你的账号" />
            </div>
          </div>

          <div class="field">
            <label class="label">密码</label>
            <div class="input-line">
              <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/></svg></span>
              <input type="password" id="password" placeholder="输入你的密码" />
              <button type="button" class="toggle-pw" data-target="password">显示</button>
            </div>
          </div>

          <div class="field">
            <label class="label" style="display:flex;justify-content:space-between">
              <span>记住我</span>
              <span style="color:var(--text-dim)">30 天免登录</span>
            </label>
            <label style="font-size:12px;color:var(--text-dim);cursor:pointer">
              <input type="checkbox" id="remember" /> 启用记住我
            </label>
          </div>

          <div class="hint" id="loginHint"></div>
          <button class="btn" type="submit">登 录</button>
        </form>

        <p class="switch">还没有账号？<a href="/register.html">前往注册 →</a></p>
      </div>

      <!-- 登录成功面板 -->
      <div class="panel welcome" id="welcomePanel" style="display:none">
        <h1 class="title">欢 迎 回 来</h1>
        <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" stroke="var(--gold)" stroke-width="2" opacity="0.55" />
          <path d="M50 6 L59 41 L94 50 L59 59 L50 94 L41 59 L6 50 L41 41 Z" fill="var(--gold-strong)" opacity="0.92" />
        </svg>
        <div class="who" id="welcomeName">旅行者</div>
        <div class="meta" id="welcomeMeta"></div>
        <button class="btn" id="logoutBtn">退 出 登 录</button>
      </div>
    </div>

    <script src="/js/link.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/fx.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
