<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 演示站点</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">🔐</div>
      <h2>Welcome</h2>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">登录</button>
      <button class="tab" data-tab="register">注册</button>
    </div>

    <form id="loginForm" class="form active" novalidate>
      <div class="field">
        <input name="username" placeholder="用户名" autocomplete="username" required />
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="button" class="toggle" data-target="loginForm">显示</button>
      </div>
      <label class="remember">
        <input type="checkbox" name="remember" /> 记住我（30 天）
      </label>
      <button type="submit" class="primary">登录</button>
      <p class="msg"></p>
    </form>

    <form id="registerForm" class="form" novalidate>
      <div class="field">
        <input name="username" placeholder="用户名（字母/数字/下划线，3-20 位）" autocomplete="username" required />
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required />
        <button type="button" class="toggle" data-target="registerForm">显示</button>
      </div>
      <div class="strength">
        <div class="bar"><span></span></div>
        <small class="strength-label">密码强度：—</small>
      </div>
      <button type="submit" class="primary">注册</button>
      <p class="msg"></p>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
