<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>控制台 · 演示站点</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card wide">
    <div class="topbar">
      <div class="user">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="name" id="who">加载中…</div>
          <div class="sub">已登录</div>
        </div>
      </div>
      <button id="theme" class="ghost" title="切换主题">🌙</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="s-login">—</div><div class="lbl">累计登录</div></div>
      <div class="stat"><div class="num" id="s-created">—</div><div class="lbl">注册于</div></div>
      <div class="stat"><div class="num" id="s-last">—</div><div class="lbl">上次登录</div></div>
    </div>

    <details class="panel">
      <summary>修改密码</summary>
      <form id="pwForm" class="form" novalidate>
        <input name="current" type="password" placeholder="当前密码" required />
        <input name="next" type="password" placeholder="新密码（至少 6 位）" required />
        <button type="submit" class="primary">保存修改</button>
        <p class="msg"></p>
      </form>
    </details>

    <button id="logout" class="primary">退出登录</button>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/dashboard.js"></script>
</body>
</html>
