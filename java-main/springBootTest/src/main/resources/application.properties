spring.application.name=springBootTest
spring.profiles.active=dev
#MySQL数据源配置(密码优先读环境变量 DB_PASSWORD,未设置时用默认值)
spring.datasource.url=jdbc:mysql://localhost:3306/springboottest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#MyBatis-Plus配置:控制台打印SQL,驼峰映射
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
#日志级别配置
logging.level.root=info
logging.level.com.fengling.springboot=warn
#日志文件输出路径
logging.file.name=log/xx.log
#控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
#文件日志格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
